name: Backend security patch checks

on:
  push:
    branches:
      - "audit/**"
      - "main"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-security-check.yml"
      - "src/**"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

jobs:
  backend-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile original Python sources
        run: python -m py_compile backend/server.py backend/patch_server.py
      - name: Apply production patch in an isolated directory
        run: |
          mkdir -p /tmp/faktuvi-backend-check
          cp backend/server.py backend/patch_server.py /tmp/faktuvi-backend-check/
          cd /tmp/faktuvi-backend-check
          python patch_server.py
          sha256sum server.py > /tmp/server-before-idempotency.sha
          python patch_server.py
          sha256sum server.py > /tmp/server-after-idempotency.sha
          diff -u /tmp/server-before-idempotency.sha /tmp/server-after-idempotency.sha
          python -m py_compile server.py patch_server.py
      - name: Assert HTML escaping is present in patched backend
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("/tmp/faktuvi-backend-check/server.py").read_text(encoding="utf-8")
          parsed = ast.parse(source)
          assert "import html" in source
          assert 'html.escape(str(item["description"]), quote=True)' in source
          assert 'html.escape(str(doc["notes"]), quote=True)' in source
          assert 'html.escape(parse_iso_date(due_date), quote=True)' in source
          assert 'html.escape(parse_iso_date(valid_until), quote=True)' in source
          assert 'html.escape(str(company["logo_base64"]), quote=True)' in source
          assert "fonts.googleapis.com" not in source
          assert "request_origin_value in configured_origins" in source
          assert "def effective_plan(user: dict)" in source
          assert "def require_plan(user: dict, required_plan: str)" in source
          assert "async def enforce_free_monthly_limit(user: dict, collection, document_label: str)" in source
          assert "Avoid creating a second recurring Stripe subscription for the same account." in source
          assert '"subscription_status": "cancel_at_period_end" if obj.get("cancel_at_period_end") else obj.get("status", "unknown"),' in source
          assert 'require_plan(user, "pro")' in source
          assert 'require_plan(user, "business")' in source
          assert 'subscription = effective_plan(user)' in source
          assert "Never build Stripe return URLs from an arbitrary Origin header." in source
          assert "Same-origin /api proxy makes cross-site cookies unnecessary; Lax blocks cross-site POSTs." in source
          assert "HTML injection hardening" not in source

          def function_block(name):
              node = next(
                  node for node in parsed.body
                  if isinstance(node, (ast.AsyncFunctionDef, ast.FunctionDef)) and node.name == name
              )
              return ast.get_source_segment(source, node)

          assert 'await enforce_free_monthly_limit(user, db.quotes, "offertes")' in function_block("duplicate_quote")
          assert 'await enforce_free_monthly_limit(user, db.invoices, "facturen")' in function_block("convert_quote_to_invoice")
          assert "existing_subscription_id = user.get(\"stripe_subscription_id\")" in function_block("create_subscription_checkout")
          assert "status_code=409" in function_block("create_subscription_checkout")

          assert 'require_plan(user, "pro")' in function_block("upload_logo")
          assert 'require_plan(user, "pro")' in function_block("send_quote_email")
          assert 'require_plan(user, "pro")' in function_block("send_invoice_email")
          assert 'require_plan(user, "business")' in function_block("create_invoice_payment_link")
          assert 'success_url": f"{origin}/payment-success?session_id={{CHECKOUT_SESSION_ID}}' in source
          assert 'company.pop("logo_base64", None)' in function_block("get_company")
          assert 'company_data.pop("logo_base64", None)' in function_block("update_company")
          assert 'if effective_plan(user) == "free"' not in function_block("update_company")
          assert "ALLOWED_LOGO_CONTENT_TYPES" in function_block("upload_logo")
          assert "MAX_LOGO_SIZE_BYTES" in function_block("upload_logo")
          assert 'require_plan' not in function_block("get_quote"), "Free plan must retain quote access"
          assert 'require_plan' not in function_block("get_invoice"), "Free plan must retain invoice access"
          assert 'company.get("_plan") in {"pro", "business"}' in source
          assert '"user_id": user["_id"]' in function_block("get_quote")
          assert '"user_id": user["_id"]' in function_block("get_invoice")
          assert '"user_id": user["_id"]' in function_block("get_quotes")
          assert '"user_id": user["_id"]' in function_block("get_invoices")
          assert '"user_id": user["_id"]' in function_block("update_quote")
          assert '"user_id": user["_id"]' in function_block("delete_quote")
          assert '"user_id": user["_id"]' in function_block("update_invoice")
          assert '"user_id": user["_id"]' in function_block("delete_invoice")
          assert '"user_id": user["_id"]' in function_block("get_company")
          assert '"user_id": user["_id"]' in function_block("update_company")
          assert 'return "lax"' in function_block("get_cookie_samesite")
          assert "active_reset_count >= 3" in function_block("forgot_password")
          assert "count_documents" in function_block("forgot_password")
          assert "find_one_and_update" in function_block("reset_password")
          assert "return_document=ReturnDocument.BEFORE" in function_block("reset_password")
          assert 'return "none" if IS_PRODUCTION else "lax"' not in function_block("get_cookie_samesite")
          payment_lib = Path("src/lib/subscription.ts").read_text(encoding="utf-8")
          assert 'transactionStatus === "pending" && failedSession' in payment_lib
          assert '"complete", "completed"' not in payment_lib
          payment_page = Path("src/routes/_authenticated/payment-success.tsx").read_text(encoding="utf-8")
          assert 'status.data?.status.toLowerCase()' in payment_page
          print("HTML escaping, allowed origins, and route-level plan gates verified.")
          PY

      - name: Test subscription entitlement rules
        run: |
          python - <<'PY'
          import ast
          import asyncio
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path("/tmp/faktuvi-backend-check/server.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          wanted = {"normalize_plan", "effective_plan", "require_plan", "enforce_free_monthly_limit"}
          nodes = [
              node for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in wanted
          ]
          assignments = [
              node for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id in {"PLAN_ALIASES", "PLAN_RANK", "ACTIVE_SUBSCRIPTION_STATUSES"} for target in node.targets)
          ]
          assert {node.name for node in nodes} == wanted, "Entitlement functions missing"
          class HTTPException(Exception):
              def __init__(self, status_code, detail):
                  self.status_code = status_code
                  self.detail = detail
          namespace = {"HTTPException": HTTPException, "datetime": datetime, "timezone": timezone}
          exec(compile(ast.Module(body=assignments + nodes, type_ignores=[]), "<entitlements>", "exec"), namespace)
          effective_plan = namespace["effective_plan"]
          require_plan = namespace["require_plan"]
          enforce_free_monthly_limit = namespace["enforce_free_monthly_limit"]
          assert effective_plan({"subscription": "free"}) == "free"
          assert effective_plan({"subscription": "pro", "subscription_status": "active", "stripe_subscription_id": "sub_test_pro"}) == "pro"
          assert effective_plan({"subscription": "business", "subscription_status": "active", "stripe_subscription_id": "sub_test_business"}) == "business"
          assert effective_plan({"subscription": "pro", "subscription_status": "cancel_at_period_end", "stripe_subscription_id": "sub_test_pro"}) == "pro"
          assert effective_plan({"subscription": "pro", "subscription_status": "active"}) == "free"
          assert effective_plan({"subscription": "pro", "stripe_subscription_id": "sub_test_pro"}) == "free"
          assert effective_plan({"subscription": "pro", "subscription_status": "past_due", "stripe_subscription_id": "sub_test_123"}) == "free"
          assert effective_plan({"subscription": "pro", "subscription_status": "active"}) == "free"
          assert effective_plan({"subscription": "business", "subscription_status": "canceled"}) == "free"
          require_plan({"subscription": "pro", "subscription_status": "active", "stripe_subscription_id": "sub_test_pro"}, "pro")
          try:
              require_plan({"subscription": "free"}, "pro")
          except HTTPException as exc:
              assert exc.status_code == 403
          else:
              raise AssertionError("Free plan unexpectedly received Pro access")
          try:
              require_plan({"subscription": "pro", "subscription_status": "past_due", "stripe_subscription_id": "sub_test_pro"}, "business")
          except HTTPException as exc:
              assert exc.status_code == 403
          else:
              raise AssertionError("Past-due subscription unexpectedly retained paid access")

          class FakeCollection:
              def __init__(self, count):
                  self.count = count
              async def count_documents(self, query):
                  assert query["user_id"] in {"user-free", "user-pro"}
                  assert "$gte" in query["created_at"]
                  return self.count

          asyncio.run(enforce_free_monthly_limit(
              {"_id": "user-free", "subscription": "free"}, FakeCollection(4), "offertes"
          ))
          try:
              asyncio.run(enforce_free_monthly_limit(
                  {"_id": "user-free", "subscription": "free"}, FakeCollection(5), "offertes"
              ))
          except HTTPException as exc:
              assert exc.status_code == 403
          else:
              raise AssertionError("Free plan monthly quota unexpectedly exceeded")
          asyncio.run(enforce_free_monthly_limit(
              {"_id": "user-pro", "subscription": "pro", "subscription_status": "active", "stripe_subscription_id": "sub_test_pro"},
              FakeCollection(100), "offertes"
          ))
          origin_node = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef) and node.name == "request_origin"
          )
          class FakeRequest:
              def __init__(self, origin=None):
                  self.headers = {"origin": origin} if origin else {}
          fake_os = type("FakeOS", (), {
              "environ": {"CORS_ORIGINS": "https://www.faktuvi.nl,https://faktuvi.nl"}
          })()
          origin_namespace = {
              "os": fake_os,
              "Request": object,
              "FRONTEND_URL": "https://www.faktuvi.nl",
          }
          exec(compile(ast.Module(body=[origin_node], type_ignores=[]), "<origin>", "exec"), origin_namespace)
          request_origin = origin_namespace["request_origin"]
          assert request_origin(FakeRequest("https://www.faktuvi.nl")) == "https://www.faktuvi.nl"
          assert request_origin(FakeRequest("https://faktuvi.nl")) == "https://faktuvi.nl"
          assert request_origin(FakeRequest("https://attacker.example")) == "https://www.faktuvi.nl"
          assert request_origin(FakeRequest()) == "https://www.faktuvi.nl"
          print("Free/Pro/Business entitlement and Stripe return-origin checks passed.")
          PY

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies from lockfile
        run: bun install --frozen-lockfile
      - name: Build frontend and regenerate the typed route tree
        run: bun run build
      - name: Type-check all frontend TypeScript
        run: bunx tsc --noEmit
      - name: Lint the complete frontend source tree
        run: bunx eslint src --rule 'prettier/prettier: off'
